<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020617">
  <title>LED Visualizer — Sandbox</title>
  <link rel="stylesheet" href="/app.css">
  <style>
    body { background: #000; overflow-x: hidden; }

    .viz-page {
      padding-top: calc(52px + 1rem);
      padding-inline: 1rem;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      padding-bottom: 2rem;
    }

    /* ── Canvas stage ── */
    .stage {
      position: relative;
      background: #000;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border);
      aspect-ratio: 16/9;
      width: 100%;
    }

    /* Room ambient glow — blurred version of the frame LEDs */
    #ambientCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      filter: blur(40px);
      opacity: 0.55;
      border-radius: var(--radius-lg);
    }

    /* Wall art placeholder */
    .wall-art {
      position: absolute;
      border-radius: 4px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .wall-art-label {
      color: rgba(255,255,255,.12);
      font-size: clamp(.6rem, 1.5vw, .9rem);
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }

    /* LED strip canvas — on top */
    #ledCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── Controls panel ── */
    .controls-card {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .65rem;
      padding: .85rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .controls-card .divider-v {
      width: 1px; height: 1.5rem;
      background: var(--border);
      flex-shrink: 0;
    }

    .minutes-group {
      display: flex; align-items: center; gap: .4rem;
      font-size: .8rem; color: var(--text-muted); white-space: nowrap;
    }
    .minutes-group input { width: 4rem; text-align: right; }

    /* ── Connection badge ── */
    .conn-badge {
      margin-left: auto;
      display: flex; align-items: center; gap: .4rem;
      font-size: .75rem; color: var(--text-dim);
    }

    /* ── Progress bar ── */
    .progress-wrap {
      display: flex; flex-direction: column; gap: .3rem;
    }
    .progress-bar-track {
      height: 6px;
      background: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c2d12, #ea580c, #f97316, #fbbf24, #e2e8f0);
      border-radius: 999px;
      width: 0%;
      transition: width .4s ease;
    }
    .progress-meta {
      display: flex; justify-content: space-between;
      font-size: .72rem; color: var(--text-dim);
    }

    /* ── LED info row ── */
    .led-info {
      display: flex; align-items: center; gap: 1rem;
      font-size: .78rem; color: var(--text-muted);
      flex-wrap: wrap;
    }
    .color-swatch-lg {
      width: 1.5rem; height: 1.5rem;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.15);
      background: #000;
      flex-shrink: 0;
      box-shadow: 0 0 8px currentColor;
    }

    /* ── Log ── */
    #vizLog { height: 110px; font-size: .72rem; }

    @media (max-width: 500px) {
      .controls-card { gap: .45rem; }
      .controls-card .divider-v { display: none; }
    }
  </style>
</head>
<body>

<nav class="topbar">
  <a href="/" class="btn btn-ghost btn-sm" aria-label="Alarm">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
  </a>
  <span class="topbar-title">LED Visualizer</span>
  <div id="connBadge" class="status-badge" style="font-size:.7rem">
    <span class="status-dot" id="connDot"></span>
    <span id="connLabel">connecting…</span>
  </div>
</nav>

<main class="viz-page">

  <!-- Stage -->
  <div class="stage" id="stage">
    <canvas id="ambientCanvas"></canvas>
    <div class="wall-art" id="wallArt">
      <span class="wall-art-label">Picture</span>
    </div>
    <canvas id="ledCanvas"></canvas>
  </div>

  <!-- Sunrise controls -->
  <div class="controls-card">
    <button id="startBtn" class="btn btn-primary btn-sm">▶ Start sunrise</button>
    <button id="stopBtn"  class="btn btn-ghost btn-sm" disabled>⏹ Stop</button>

    <div class="divider-v"></div>

    <div class="minutes-group">
      <label for="durationInput">Duration</label>
      <input id="durationInput" type="number" class="input" min="0.1" max="120" step="0.1" value="1">
      <span>min</span>
    </div>

    <div class="divider-v"></div>

    <button id="setColorBtn" class="btn btn-ghost btn-sm">🎨 Set color</button>
    <input id="colorPicker" type="color" value="#ff6600" style="width:2rem;height:1.8rem;border:none;background:none;cursor:pointer;padding:0">

    <button id="offBtn" class="btn btn-danger btn-sm">Off</button>

    <div class="divider-v"></div>

    <button id="muteBtn" class="btn btn-ghost btn-sm" title="Mute/unmute audio">🔊 Audio</button>
  </div>

  <!-- Progress -->
  <div class="progress-wrap card" style="padding:.85rem 1rem; gap:.5rem; display:flex; flex-direction:column;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="section-label">Sunrise progress</span>
      <span id="progressPct" style="font-size:.78rem; color:var(--text-dim)">—</span>
    </div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="led-info">
      <div class="color-swatch-lg" id="colorSwatch"></div>
      <span id="rgbLabel">RGB: —</span>
      <span id="hexLabel">—</span>
      <span id="statusLabel" style="margin-left:auto; font-weight:600"></span>
    </div>
  </div>

  <!-- Log -->
  <div style="display:flex; flex-direction:column; gap:.4rem;">
    <span class="section-label">Events</span>
    <textarea id="vizLog" class="console" readonly placeholder="WebSocket events will appear here…"></textarea>
  </div>

</main>

<div class="toast-container" id="toasts" aria-live="polite"></div>

<script>
// ── Layout constants ──────────────────────────────────────────────────────────

const LEDS = 300;

// 16:9 perimeter distribution: top=96, right=54, bottom=96, left=54
// (2*(96+54) = 300 ✓)
const TOP    = 96;
const RIGHT  = 54;
const BOTTOM = 96;
const LEFT   = 54;

// LED positions as { side, indexOnSide } (computed once, reused each frame)
let ledPositions = null; // filled by computeLEDPositions()

// Canvas contexts
let ledCtx = null, ambCtx = null;
let stageW = 0, stageH = 0;

// Frame padding (fraction of stage size) — space for LEDs outside the art
const FRAME_PAD = 0.065;

// Current pixel state: array of 300 integers (0x00RRGGBB)
let currentPixels = new Array(LEDS).fill(0);

// ── LED position math ─────────────────────────────────────────────────────────

function computeLEDPositions(w, h) {
  const pad = Math.round(Math.min(w, h) * FRAME_PAD);
  const artX = pad, artY = pad;
  const artW = w - pad * 2, artH = h - pad * 2;

  const positions = [];

  // Top edge: left → right, indices 0..(TOP-1)
  for (let i = 0; i < TOP; i++) {
    const frac = i / (TOP - 1);
    positions.push({ x: artX + frac * artW, y: artY });
  }
  // Right edge: top → bottom, indices TOP..(TOP+RIGHT-1)
  for (let i = 0; i < RIGHT; i++) {
    const frac = i / (RIGHT - 1);
    positions.push({ x: artX + artW, y: artY + frac * artH });
  }
  // Bottom edge: right → left, indices (TOP+RIGHT)..(TOP+RIGHT+BOTTOM-1)
  for (let i = 0; i < BOTTOM; i++) {
    const frac = i / (BOTTOM - 1);
    positions.push({ x: artX + artW - frac * artW, y: artY + artH });
  }
  // Left edge: bottom → top, indices (TOP+RIGHT+BOTTOM)..(LEDS-1)
  for (let i = 0; i < LEFT; i++) {
    const frac = i / (LEFT - 1);
    positions.push({ x: artX, y: artY + artH - frac * artH });
  }

  // Also store art bounds for the wall-art div
  return { positions, artX, artY, artW, artH, pad };
}

// ── Canvas sizing ─────────────────────────────────────────────────────────────

function resizeCanvases() {
  const stage = document.getElementById('stage');
  const ledCanvas = document.getElementById('ledCanvas');
  const ambCanvas = document.getElementById('ambientCanvas');
  const wallArt   = document.getElementById('wallArt');

  const rect = stage.getBoundingClientRect();
  stageW = Math.round(rect.width  * devicePixelRatio);
  stageH = Math.round(rect.height * devicePixelRatio);

  for (const c of [ledCanvas, ambCanvas]) {
    c.width  = stageW;
    c.height = stageH;
  }

  ledCtx = ledCanvas.getContext('2d');
  ambCtx = ambCanvas.getContext('2d');

  ledPositions = computeLEDPositions(stageW, stageH);

  // Position the wall-art div to match the art area
  const s = 1 / devicePixelRatio;
  const { artX, artY, artW, artH } = ledPositions;
  wallArt.style.left   = (artX * s) + 'px';
  wallArt.style.top    = (artY * s) + 'px';
  wallArt.style.width  = (artW * s) + 'px';
  wallArt.style.height = (artH * s) + 'px';

  // Re-render with current pixel state
  renderFrame();
}

// ── Render ────────────────────────────────────────────────────────────────────

const LED_RADIUS = Math.max(4, Math.round(Math.min(window.innerWidth, window.innerHeight) * 0.008));

function intToRGB(v) {
  return { r: (v >> 16) & 0xff, g: (v >> 8) & 0xff, b: v & 0xff };
}

function renderFrame() {
  if (!ledCtx || !ambCtx || !ledPositions) return;

  const { positions } = ledPositions;
  const r = Math.max(3, Math.round(Math.min(stageW, stageH) * 0.008));

  // ── LED canvas ──
  ledCtx.clearRect(0, 0, stageW, stageH);

  for (let i = 0; i < LEDS; i++) {
    const { x, y } = positions[i];
    const { r: cr, g: cg, b: cb } = intToRGB(currentPixels[i]);
    const brightness = (cr + cg + cb) / 3;
    const color = `rgb(${cr},${cg},${cb})`;

    // Outer glow (only when the LED has some brightness)
    if (brightness > 4) {
      ledCtx.save();
      ledCtx.shadowColor = color;
      ledCtx.shadowBlur  = r * 3.5;
      ledCtx.fillStyle   = color;
      ledCtx.beginPath();
      ledCtx.arc(x, y, r, 0, Math.PI * 2);
      ledCtx.fill();
      ledCtx.restore();
    }

    // LED dot — always drawn (dark when off)
    const dotColor = brightness > 4 ? color : '#1a1a2e';
    ledCtx.fillStyle = dotColor;
    ledCtx.beginPath();
    ledCtx.arc(x, y, r * 0.6, 0, Math.PI * 2);
    ledCtx.fill();
  }

  // ── Ambient canvas (blurred room glow) ──
  ambCtx.clearRect(0, 0, stageW, stageH);
  const { artX, artY, artW, artH } = ledPositions;

  for (let i = 0; i < LEDS; i++) {
    const { x, y } = positions[i];
    const { r: cr, g: cg, b: cb } = intToRGB(currentPixels[i]);
    const brightness = (cr + cg + cb) / 3;
    if (brightness < 8) continue;

    // Each LED casts a large diffuse blob inward toward the art
    const cx = artX + artW / 2;
    const cy = artY + artH / 2;
    // Inward point: 30% toward center
    const bx = x + (cx - x) * 0.3;
    const by = y + (cy - y) * 0.3;

    const grad = ambCtx.createRadialGradient(bx, by, 0, bx, by, artW * 0.55);
    grad.addColorStop(0,   `rgba(${cr},${cg},${cb},0.35)`);
    grad.addColorStop(1,   `rgba(${cr},${cg},${cb},0)`);
    ambCtx.fillStyle = grad;
    ambCtx.beginPath();
    ambCtx.arc(bx, by, artW * 0.55, 0, Math.PI * 2);
    ambCtx.fill();
  }
}

// ── WebSocket connection ──────────────────────────────────────────────────────

let ws = null;
let reconnectTimer = null;

function connect() {
  const url = `ws://${location.hostname}:5455`;
  ws = new WebSocket(url);

  ws.addEventListener('open', () => {
    setConn(true);
    appendLog(`Connected to mock daemon (${url})`);
    clearTimeout(reconnectTimer);
  });

  ws.addEventListener('close', () => {
    setConn(false);
    appendLog('Disconnected — retrying in 2s…');
    reconnectTimer = setTimeout(connect, 2000);
  });

  ws.addEventListener('error', () => {
    setConn(false);
  });

  ws.addEventListener('message', e => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }

    if (msg.type === 'ledState') {
      currentPixels = msg.pixels;
      renderFrame();
      updateColorInfo();
      return; // don't log every frame
    }

    if (msg.type === 'sunriseStarted') {
      appendLog(`▶ Sunrise started — ${msg.minutes} min, ${msg.steps} steps`);
      setSunriseRunning(true);
    } else if (msg.type === 'sunriseProgress') {
      setProgress(msg.pct, msg.r, msg.g, msg.b);
    } else if (msg.type === 'audioFadeIn') {
      startAudioFadeIn(msg.durationS ?? 20);
    } else if (msg.type === 'audioFadeOut') {
      startAudioFadeOut(10);
    } else if (msg.type === 'sunriseDone') {
      appendLog(msg.aborted ? '⏹ Sunrise aborted' : '✓ Sunrise complete');
      setProgress(msg.aborted ? null : 100);
      setSunriseRunning(false);
    } else if (msg.type === 'sunriseStopping') {
      appendLog('⏹ Stop signal sent');
    } else if (msg.type === 'sunriseQueued') {
      appendLog(`⏳ Sunrise queued — ${msg.minutes} min`);
    } else if (msg.type === 'set') {
      appendLog(`Color → RGB(${msg.r},${msg.g},${msg.b})`);
    } else if (msg.type === 'off') {
      appendLog('LEDs off');
      setProgress(null);
    } else if (msg.ok === false) {
      appendLog(`Error: ${msg.error}`);
    }
  });
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

// ── UI helpers ────────────────────────────────────────────────────────────────

function setConn(ok) {
  document.getElementById('connDot').className   = 'status-dot ' + (ok ? 'ok' : 'err');
  document.getElementById('connLabel').textContent = ok ? 'connected' : 'offline';
}

let sunriseRunning = false;
function setSunriseRunning(running) {
  sunriseRunning = running;
  document.getElementById('startBtn').disabled = running;
  document.getElementById('stopBtn').disabled  = !running;
  document.getElementById('statusLabel').textContent = running ? '🌅 Sunrise running…' : '';
  document.getElementById('statusLabel').style.color = running ? 'var(--primary)' : '';
}

function setProgress(pct, r, g, b) {
  const fill  = document.getElementById('progressFill');
  const label = document.getElementById('progressPct');
  if (pct === null || pct === undefined) {
    fill.style.width = '0%';
    label.textContent = '—';
  } else {
    fill.style.width = pct + '%';
    label.textContent = pct + '%';
  }
}

function updateColorInfo() {
  // Use the average of all LEDs to determine the dominant color
  let rt = 0, gt = 0, bt = 0, count = 0;
  for (const v of currentPixels) {
    if (v > 0) {
      rt += (v >> 16) & 0xff;
      gt += (v >> 8)  & 0xff;
      bt +=  v        & 0xff;
      count++;
    }
  }
  if (count === 0) {
    document.getElementById('colorSwatch').style.background = '#000';
    document.getElementById('rgbLabel').textContent = 'RGB: 0, 0, 0';
    document.getElementById('hexLabel').textContent = '#000000';
    return;
  }
  const r = Math.round(rt / count);
  const g = Math.round(gt / count);
  const b = Math.round(bt / count);
  const hex = '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
  const swatch = document.getElementById('colorSwatch');
  swatch.style.background = hex;
  swatch.style.boxShadow  = `0 0 10px ${hex}`;
  document.getElementById('rgbLabel').textContent = `RGB: ${r}, ${g}, ${b}`;
  document.getElementById('hexLabel').textContent = hex;
}

const logLines = [];
function appendLog(msg) {
  const now = new Date().toLocaleTimeString('en', { hour12: false });
  logLines.push(`[${now}] ${msg}`);
  if (logLines.length > 200) logLines.shift();
  const el = document.getElementById('vizLog');
  el.value = logLines.join('\n');
  el.scrollTop = el.scrollHeight;
}

function showToast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');
  t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ── Button wiring ─────────────────────────────────────────────────────────────

document.getElementById('startBtn').addEventListener('click', () => {
  const mins = parseFloat(document.getElementById('durationInput').value) || 1;
  send({ cmd: 'startSunrise', minutes: mins, delayMs: 40 });
  appendLog(`▶ Sent startSunrise (${mins} min)`);
});

document.getElementById('stopBtn').addEventListener('click', () => {
  send({ cmd: 'stopSunrise' });
});

document.getElementById('offBtn').addEventListener('click', () => {
  send({ cmd: 'off' });
});

let muted = false;
document.getElementById('muteBtn').addEventListener('click', () => {
  muted = !muted;
  if (gainNode) gainNode.gain.setValueAtTime(muted ? 0 : 1, audioCtx.currentTime);
  const btn = document.getElementById('muteBtn');
  btn.textContent = muted ? '🔇 Muted' : '🔊 Audio';
  btn.className = 'btn btn-sm ' + (muted ? 'btn-ghost' : 'btn-ghost');
  btn.style.opacity = muted ? '0.5' : '1';
  appendLog(muted ? '🔇 Muted' : '🔊 Unmuted');
});

document.getElementById('setColorBtn').addEventListener('click', () => {
  const hex = document.getElementById('colorPicker').value;
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  send({ cmd: 'set', r, g, b });
  appendLog(`🎨 Set color ${hex}`);
});

// Allow the color picker alone to also set the color on change
document.getElementById('colorPicker').addEventListener('change', () => {
  document.getElementById('setColorBtn').click();
});

// ── Web Audio engine ──────────────────────────────────────────────────────────

let audioCtx = null;
let audioBuffer = null;
let audioSource = null;
let gainNode = null;
let audioLoaded = false;
let audioFading = false;

async function loadAudio() {
  if (audioLoaded) return;
  try {
    const res = await fetch('/birds.mp3');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const arrayBuf = await res.arrayBuffer();
    audioCtx = new AudioContext();
    audioBuffer = await audioCtx.decodeAudioData(arrayBuf);
    audioLoaded = true;
    appendLog('🎵 Audio loaded (' + (audioBuffer.duration / 60).toFixed(1) + ' min)');
  } catch (e) {
    appendLog('⚠ Audio load failed: ' + e.message);
  }
}

function startAudioFadeIn(durationS = 20) {
  if (!audioLoaded || !audioCtx) { appendLog('⚠ Audio not loaded yet'); return; }
  if (audioSource) { try { audioSource.stop(); } catch {} audioSource = null; }
  if (audioFading) return;

  // Resume context if suspended (browsers require a user gesture first;
  // in sandbox the Start button click is enough)
  audioCtx.resume();

  gainNode = audioCtx.createGain();
  gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
  gainNode.gain.linearRampToValueAtTime(1.0, audioCtx.currentTime + durationS);
  gainNode.connect(audioCtx.destination);

  audioSource = audioCtx.createBufferSource();
  audioSource.buffer = audioBuffer;
  audioSource.loop = true;
  audioSource.connect(gainNode);
  audioSource.start();
  audioFading = true;

  appendLog(`🎵 Audio fade-in started (${durationS}s)`);
}

function startAudioFadeOut(durationS = 10) {
  if (!gainNode || !audioSource) return;

  const now = audioCtx.currentTime;
  gainNode.gain.cancelScheduledValues(now);
  gainNode.gain.setValueAtTime(gainNode.gain.value, now);
  gainNode.gain.linearRampToValueAtTime(0, now + durationS);

  const src = audioSource;
  audioSource = null;
  audioFading = false;

  setTimeout(() => { try { src.stop(); } catch {} }, (durationS + 0.5) * 1000);
  appendLog(`🔇 Audio fade-out started (${durationS}s)`);
}

// Pre-load audio as soon as the page loads (browsers allow fetch without gesture)
loadAudio();

// ── Init ──────────────────────────────────────────────────────────────────────

window.addEventListener('resize', resizeCanvases);

// Size canvases first, then connect so the first ledState message renders correctly
resizeCanvases();
connect();
</script>
</body>
</html>
